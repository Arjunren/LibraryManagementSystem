name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: library_test, POSTGRES_USER: library, POSTGRES_PASSWORD: library_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U library -d library_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://library:library_test@localhost:5432/library_test
      JWT_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip }
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pip-audit
      - run: python -m app.migrate
      - run: pytest -q
